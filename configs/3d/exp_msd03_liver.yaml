# 3D Experiment: MSD Task03 Liver
# CT liver organ + tumor segmentation (M=3: bg / liver / tumor)

exp_name: "segmoe_3d_msd03"
seed: 42

deterministic:
  torch_deterministic: true
  cudnn_benchmark: false

dataset:
  name: "msd_task03_liver"
  config: "configs/2d/datasets/msd_task03_liver.yaml"
  # 3D-specific preprocessing overrides
  in_channels: 1         # CT single channel
  num_classes: 3         # 0=bg, 1=liver, 2=tumor

experts_config: "configs/3d/experts.yaml"
training_config: "configs/3d/training.yaml"

# Fold settings
fold: 0
n_folds: 5

output:
  run_dir: "runs/${exp_name}"
  results_dir: "runs/${exp_name}/results"
  cache_dir: "runs/${exp_name}/cache"
