# 基础训练配置 (单卡参考 / 论文基线)
# 双卡5090请使用: training_dual_5090.yaml

batch_size: 8
epochs: 300
lr: 1.0e-4

optimizer:
  name: "adamw"
  weight_decay: 0.01

scheduler:
  name: "cosine"
  min_lr: 1.0e-6
  warmup_epochs: 10

amp:
  enabled: true
  dtype: "bfloat16"

gradient_accumulation_steps: 1

dataloader:
  num_workers: 2
  pin_memory: true

loss:
  name: "ce_plus_dice"
  dice_smooth: 1.0
  dice_weight: 1.0
  ce_weight: 1.0

checkpoint:
  save_best: true
  save_last: true
  monitor: "val_dice_mean"

logging:
  log_interval: 20
  val_interval: 1
