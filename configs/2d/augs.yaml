# Albumentations 数据增强 (医学图像分割优化版)
# 全局 seed 固定时可复现

train:
  # ---- 空间变换 ----
  - name: "HorizontalFlip"
    p: 0.5
  - name: "VerticalFlip"
    p: 0.5
  - name: "Affine"
    translate_percent: [-0.1, 0.1]
    scale: [0.85, 1.15]
    rotate: [-20, 20]
    border_mode: 0
    p: 0.5
  - name: "ElasticTransform"
    alpha: 120
    sigma: 6
    p: 0.3
  - name: "GridDistortion"
    num_steps: 5
    distort_limit: 0.3
    p: 0.3

  # ---- 像素/色彩变换 ----
  - name: "RandomBrightnessContrast"
    brightness_limit: 0.2
    contrast_limit: 0.2
    p: 0.4
  - name: "GaussNoise"
    std_range: [0.009, 0.022]
    p: 0.3
  - name: "GaussianBlur"
    blur_limit: [3, 5]
    p: 0.2

  # ---- 正则化 (Cutout) ----
  - name: "CoarseDropout"
    num_holes_range: [2, 8]
    hole_height_range: [8, 32]
    hole_width_range: [8, 32]
    fill: 0
    p: 0.3

val:
  - name: "NoOp"

normalize:
  mode: "imagenet"
