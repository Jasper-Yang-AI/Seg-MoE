name: "acdc"

task:
  # ACDC labels: 0=background, 1=RV, 2=myocardium, 3=LV (common convention)
  num_classes: 4
  include_background_in_mean: false
  ignore_index: null
  label_map:
    0: 0
    1: 1
    2: 2
    3: 3

paths:
  raw_dir: "data/raw/ACDC"
  processed_dir: "data/processed/acdc"
  splits_dir: "data/splits/acdc"

raw_structure:
  # Expected layout (after manual download):
  # data/raw/ACDC/ACDC/database/training/patientXXX/*_frameXX.nii.gz and *_gt.nii.gz
  training_dir: "ACDC/database/training"

input:
  image_size: [256, 256]
  image_channels: 1
  normalize:
    mode: "imagenet"

nifti:
  slice_axis: 0
  slice_policy: "non_empty"
  min_fg_pixels: 10
  intensity:
    mode: "minmax"

split:
  type: "5fold_from_all"
  folds: 5
  seed: 42
  group_key: "patient_id"
