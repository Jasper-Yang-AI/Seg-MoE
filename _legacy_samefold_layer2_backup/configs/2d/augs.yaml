# Albumentations augmentation (reproducible when seed is fixed)

train:
  - name: "HorizontalFlip"
    p: 0.5
  - name: "VerticalFlip"
    p: 0.5
  - name: "Rotate"
    limit: 15
    border_mode: 0
    p: 0.5
  - name: "RandomBrightnessContrast"
    brightness_limit: 0.2
    contrast_limit: 0.2
    p: 0.3

val:
  - name: "NoOp"

normalize:
  mode: "imagenet"
