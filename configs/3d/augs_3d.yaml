# 3D 数据增强配置 (MONAI transforms)
# 适配前列腺 MRI 3D 分割; 强度增强保持 per-channel

train:
  # ---- Spatial ----
  - name: RandFlipd
    prob: 0.5
    spatial_axis: 0
  - name: RandFlipd
    prob: 0.5
    spatial_axis: 1
  - name: RandFlipd
    prob: 0.5
    spatial_axis: 2
  - name: RandRotate90d
    prob: 0.3
    max_k: 3
    spatial_axes: [0, 1]
  - name: RandAffined
    prob: 0.3
    rotate_range: [0.2, 0.2, 0.2]
    scale_range: [0.1, 0.1, 0.1]
    mode: bilinear
    padding_mode: border
  # ---- Intensity (image only) ----
  - name: RandScaleIntensityd
    prob: 0.3
    factors: 0.1
  - name: RandShiftIntensityd
    prob: 0.3
    offsets: 0.1
  - name: RandGaussianNoised
    prob: 0.2
    mean: 0.0
    std: 0.05
  - name: RandGaussianSmoothd
    prob: 0.1
    sigma_x: [0.5, 1.0]
    sigma_y: [0.5, 1.0]
    sigma_z: [0.5, 1.0]

val:
  []    # No augmentation at validation
