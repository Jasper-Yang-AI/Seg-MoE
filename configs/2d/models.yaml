# 2D 三专家配置 (双 RTX 5090 优化版)
# 用法: --models configs/2d/models.yaml
#
# 三专家组合: nnUNet (CNN) + SwinUNETR (Transformer) + SegResNet (ResEncoder)
# 所有专家统一输出 logits [B, M, H, W]
#
# nnUNet 使用官方 nnUNet v2 训练流程 (1000 epochs, SGD, PolyLR, 深度监督)
# 权重由 import_nnunet_weights.py 导入, Layer1 训练时 --skip-if-done 自动跳过
#
# 显存估算 (BF16, bs=16/卡):
#   nnUNet:     ~12GB/卡  (~46M params, 8-stage, 512×512, deep_supervision)
#   SwinUNETR:  ~14GB/卡  (~62M params, 256×256)
#   SegResNet:  ~5GB/卡   (~8M params, 256×256)

experts_v2:
  # Expert A: nnUNet v2 — 官方训练权重 (1000 epochs, SGD, PolyLR, Deep Supervision)
  #
  # 网络结构: PlainConvUNet (dynamic_network_architectures, 由 nnUNet 官方团队维护)
  # 训练方式: pip install nnunetv2 → nnUNetv2_train 命令 → 100% 官方流程
  # 权重导入: import_nnunet_weights.py 从 nnUNetPlans.json 读取实际架构参数
  #
  # 以下参数来自 nnUNetPlans.json → configurations.2d.architecture.arch_kwargs
  # 由 nnUNet plan_and_preprocess 在 Dataset003_Liver 上自动规划得到
  # 也可通过 import_nnunet_weights.py --update-models-yaml 自动同步
  - name: "nnunet-2d"
    type: "nnunet"
    params:
      conv_op: "Conv2d"
      n_stages: 8
      features_per_stage: [32, 64, 128, 256, 512, 512, 512, 512]
      patch_size: [512, 512]
      deep_supervision: true
      n_conv_per_stage_encoder: [2, 2, 2, 2, 2, 2, 2, 2]
      n_conv_per_stage_decoder: [2, 2, 2, 2, 2, 2, 2]
      conv_kernel_sizes: [[3,3],[3,3],[3,3],[3,3],[3,3],[3,3],[3,3],[3,3]]
      pool_op_kernel_sizes: [[1,1],[2,2],[2,2],[2,2],[2,2],[2,2],[2,2],[2,2]]

  # Expert B: Swin-UNetR — Transformer 分割网络 (MONAI)
  #
  # 训练方式: 官方 MONAI Recipe (train_swinunetr_official.py)
  #   Optimizer: AdamW (lr=1e-4, wd=1e-5)
  #   Scheduler: WarmupCosine (warmup 50 epochs)
  #   Loss:      DiceCELoss
  #   训练完成后用 import_swinunetr_weights.py 导入权重
  #   Layer1 训练时 --skip-if-done 自动跳过
  #
  # use_checkpoint=true: 梯度检查点, 用计算换显存
  - name: "swinunetr-2d"
    type: "monai_swin_unetr"
    params:
      spatial_dims: 2
      feature_size: 48
      depths: [2, 2, 2, 2]
      num_heads: [3, 6, 12, 24]
      use_checkpoint: true

  # Expert C: SegResNet — 残差编解码分割网络 (MONAI Auto3DSeg Official Recipe)
  #
  # 训练方式: 官方 MONAI Auto3DSeg SegResNet2D Recipe (train_segresnet_official.py)
  #   Network:   SegResNetDS (dsdepth=2, deep supervision)
  #   Optimizer: AdamW (lr=2e-4, wd=1e-5)
  #   Scheduler: WarmupCosine (warmup 3 epochs, epoch-level, warmup_multiplier=0.1)
  #   Loss:      DeepSupervisionLoss(DiceCELoss(squared_pred=True, batch=True))
  #   训练完成后用 import_segresnet_weights.py 导入权重
  #   Layer1 训练时 --skip-if-done 自动跳过
  #
  # 推理 dsdepth=1 (单输出, 与 pipeline 兼容)
  # 训练 dsdepth=2 的权重通过 import 脚本 strict=False 加载
  - name: "segresnet-2d"
    type: "monai_segresnet_ds"
    params:
      spatial_dims: 2
      init_filters: 32
      blocks_down: [1, 2, 2, 4, 4]
      norm: "BATCH"
      act: "relu"
      dsdepth: 1
      upsample_mode: "deconv"
