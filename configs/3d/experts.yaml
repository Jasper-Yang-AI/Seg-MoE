# 3D Expert Pool Configuration
# 三个异构 3D 专家: CNN + Transformer + ResEncoder

sota_experts:
  # 1. Swin-UNetR (Transformer)
  - architecture: "swin_unetr"
    name: "swin-unetr-base"
    enabled: true
    config:
      spatial_dims: 3
      feature_size: 48
      depths: [2, 2, 2, 2]
      num_heads: [3, 6, 12, 24]
      use_checkpoint: false

  # 2. nnUNet v2 (Modern CNN)
  - architecture: "nnunet"
    name: "nnunet-v2"
    enabled: true
    config:
      patch_size: [96, 96, 96]
      n_stages: 6
      features_per_stage: [32, 64, 128, 256, 320, 320]
      conv_op: "Conv3d"

  # 3. SegResNet (3D residual, MONAI)
  - architecture: "segresnet"
    name: "segresnet-base"
    enabled: true
    config:
      spatial_dims: 3
      init_filters: 32
      blocks_down: [1, 2, 2, 4]
      blocks_up: [1, 1, 1]

# Ensemble
ensemble_strategy:
  mode: "weighted"
  init_weights:
    transformer: 1.0
    cnn: 1.0
    resnet: 1.0
