# Unified 2D patch-level gating configuration
#
# Core idea:
# - High-order semantics from Layer2 expert logits
# - Low-order semantic prior from Layer1 OOF mean/entropy/disagreement
# - Context-aware routing from image appearance + spatial coordinates + slice position
# - Class-aware dynamic fusion with expert relation modeling

gating:
  hidden_dim: 64
  score_hidden_dim: 64
  context_hidden_dim: 32
  dropout: 0.1

  per_class: true
  use_residual_head: true
  use_entropy: true
  use_consensus_features: true
  use_disagreement_features: true
  use_confidence_features: true
  use_prior_agreement_features: true

  use_layer1_semantics: true
  use_image_context: true
  use_position_channels: true
  use_slice_position: true
  use_context_film: true

  patch_size: 64
  stride: 32
  blend_mode: "gaussian"

  temperature_start: 2.0
  temperature_end: 0.6

  load_balance_weight: 0.01
  spatial_smooth_weight: 0.002
  foreground_oversample_ratio: 0.5

training:
  batch_size: 256
  epochs: 60
  lr: 8.0e-4

  optimizer:
    name: "adamw"
    weight_decay: 0.01

  scheduler:
    name: "cosine"
    min_lr: 1.0e-6
    warmup_epochs: 5

  amp:
    enabled: true
    dtype: "bfloat16"

  loss:
    name: "ce_plus_dice"
    dice_smooth: 1.0
    ce_weight: 1.0
    dice_weight: 1.0

  dataloader:
    num_workers: 4
    pin_memory: true

  checkpoint:
    save_best: true
    save_last: true
    monitor: "val_dice"

  logging:
    log_interval: 50
    val_interval: 1
