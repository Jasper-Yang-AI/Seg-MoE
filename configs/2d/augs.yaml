# Albumentations 数据增强 (医学图像分割优化版)
# 全局 seed 固定时可复现

train:
  # ---- 空间变换 ----
  - name: "HorizontalFlip"
    p: 0.5
  - name: "VerticalFlip"
    p: 0.5
  - name: "ShiftScaleRotate"
    shift_limit: 0.1
    scale_limit: 0.15
    rotate_limit: 20
    border_mode: 0
    p: 0.5
  - name: "ElasticTransform"
    alpha: 120
    sigma: 6
    p: 0.3
  - name: "GridDistortion"
    num_steps: 5
    distort_limit: 0.3
    p: 0.3

  # ---- 像素/色彩变换 ----
  - name: "RandomBrightnessContrast"
    brightness_limit: 0.2
    contrast_limit: 0.2
    p: 0.4
  - name: "GaussNoise"
    var_limit: [5.0, 30.0]
    p: 0.3
  - name: "GaussianBlur"
    blur_limit: [3, 5]
    p: 0.2

  # ---- 正则化 (Cutout) ----
  - name: "CoarseDropout"
    max_holes: 8
    max_height: 32
    max_width: 32
    min_holes: 2
    min_height: 8
    min_width: 8
    fill_value: 0
    p: 0.3

val:
  - name: "NoOp"

normalize:
  mode: "imagenet"
