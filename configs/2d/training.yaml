# Training defaults matching Dang et al. (Springer 2024)

batch_size: 8
epochs: 300
lr: 1.0e-4

optimizer:
  name: "adam"
  weight_decay: 0.0

scheduler:
  name: "none"

amp:
  enabled: false

dataloader:
  num_workers: 4
  pin_memory: true

loss:
  name: "ce_plus_dice"
  dice_smooth: 1.0
  dice_weight: 1.0
  ce_weight: 1.0

checkpoint:
  save_best: true
  save_last: true
  monitor: "val_dice_mean"

logging:
  log_interval: 20
  val_interval: 1
