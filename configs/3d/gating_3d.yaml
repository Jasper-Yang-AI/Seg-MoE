# 3D Patch-Level Gating Network 配置
# 输入: Layer2 OOF logits [K, M, pD, pH, pW]
# 架构: 共享 3D ConvNet + Residual FC Head → softmax weights [K]

gating:
  patch_size: [32, 32, 16]   # 3D patch size (D, H, W)
  stride:     [16, 16, 8]    # 50% overlap
  hidden_dim: 64
  dropout: 0.1
  per_class: false            # False → [B, K] weights; True → [B, K, M]
  use_residual_head: true
  blend_mode: "gaussian"      # gaussian | average

  # Temperature annealing: τ 2.0 → 0.5 (训练初期均匀探索, 后期锐化)
  temperature_start: 2.0
  temperature_end: 0.5

  # Regularization
  load_balance_weight: 0.01
  spatial_smooth_weight: 0.0

  # Foreground oversampling (3D 前景稀疏)
  foreground_oversample_ratio: 0.5

training:
  lr: 1.0e-3
  epochs: 50
  batch_size: 64             # patches 比较小, BS可以大
  gradient_accumulation_steps: 1

  optimizer:
    name: "adamw"
    weight_decay: 0.01

  scheduler:
    name: "cosine"
    warmup_epochs: 5
    min_lr: 1.0e-6

  amp:
    enabled: true
    dtype: "bfloat16"

  loss:
    ce_weight: 1.0
    dice_weight: 1.0
    dice_smooth: 1.0

  dataloader:
    num_workers: 2
    pin_memory: true
