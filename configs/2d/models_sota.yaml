# SOTA Model Configurations for Seg-MoE
# Three heterogeneous experts: CNN + Transformer + Mamba

sota_experts:
  # 1. Swin-UNetR (Transformer-based)
  - architecture: "swin_unetr"
    name: "swin-unetr-base"
    enabled: true
    config:
      img_size: [256, 256]
      feature_size: 48
      spatial_dims: 2
      depths: [2, 2, 2, 2]
      num_heads: [3, 6, 12, 24]
      use_checkpoint: false
      # Optional: path to pretrained weights
      # pretrained_path: "path/to/swin_unetr_pretrained.pt"
    
  # 2. nnUNet v2 (Modern CNN)
  - architecture: "nnunet"
    name: "nnunet-v2"
    enabled: true
    config:
      patch_size: [256, 256]
      n_stages: 6
      features_per_stage: [32, 64, 125, 256, 320, 320]
      conv_op: "Conv2d"
  
  # 3. SegMamba (Mamba-based)
  - architecture: "segmamba"
    name: "segmamba-base"
    enabled: true         # ✅ Automatic fallback if Mamba not installed
    config:
      img_size: 256
      embed_dim: 96
      depths: [2, 2, 9, 2]
      drop_path_rate: 0.2
      # Optional: path to pretrained weights
      # pretrained_path: "path/to/segmamba_pretrained.pt"

# Training settings specific to SOTA models
sota_training:
  # Swin-UNetR may need lower learning rate
  swin_unetr:
    lr_multiplier: 0.1
    warmup_epochs: 10
    
  # nnUNet typically uses higher learning rate
  nnunet:
    lr_multiplier: 1.0
    
  # SegMamba (adjust as needed)
  segmamba:
    lr_multiplier: 1.0
    warmup_epochs: 5

# Options for ensemble strategies
ensemble_strategy:
  # How to combine heterogeneous experts
  mode: "weighted"  # weighted | voting | stacking
  
  # Weight initialization for different architectures
  init_weights:
    transformer: 1.0
    cnn: 1.0
    mamba: 1.0
