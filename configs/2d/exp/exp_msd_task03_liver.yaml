# Seg_MoE 2D reproduction experiment (Dang et al., Springer 2024)
# This is the single entry-point config consumed by scripts/*.

exp_name: "segmoe_2d_msd03"

seed: 42

deterministic:
  torch_deterministic: true
  cudnn_benchmark: false

# Dataset config is selected via its YAML under configs/2d/datasets/
dataset:
  name: "msd_task03_liver"
  config: "configs/2d/datasets/msd_task03_liver.yaml"

# Which methods to run in scripts/eval/eval_methods.py and scripts/eval/export_tables.py
methods:
  - single
  - mean_ensemble
  - ole
  - dt
  - we_clpso

layering:
  cache_root: "runs/${exp_name}/cache"
  cache_dtype: "float16"
  use_oof_for_layer2: true
  oof_cache_dir: "runs/${exp_name}/cache/oof/layer1"
  oof_manifest_path: "runs/${exp_name}/cache/oof/layer1/oof_manifest.jsonl"

output:
  run_dir: "runs/${exp_name}"
  results_dir: "runs/${exp_name}/results"
  tables_dir: "runs/${exp_name}/tables"
