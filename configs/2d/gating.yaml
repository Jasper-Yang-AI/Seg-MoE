#  Patch-Level 门控网络配置 
# Seg-MoE 课题核心: Layer2 logits  Patch  Gating Network  动态融合
#
# 正确流程: Layer1  L1 OOF  Layer2  L2 OOF (含 logits)  Gating  Eval
# 门控网络输入 = Layer2 专家的 OOF logits [K, M, H, W]
# 融合: fused_logits = Σ_k w_k * logits_k   CE + Dice loss (语义正确)
#
# 参考:
#   - Shazeer et al. 2017 "Outrageously Large Neural Networks" (MoE gating)
#   - Riquelme et al. 2021 "Scaling Vision with Sparse MoE" (V-MoE)
#
# 双卡 RTX 5090 最优配置 (DataParallel, 无 DDP)

gating:
  #  网络架构 
  hidden_dim: 64              # Conv 通道数 (~30-50K params total, K*M 输入通道)
  score_hidden_dim: 64        # 专家打分 MLP 隐层
  dropout: 0.1
  per_class: false            # true = [K,M] per-class per-expert; false = [K] per-expert
  use_residual_head: true     # 残差 FC shortcut, 改善梯度流
  use_entropy: true           # 从 logits 在线计算 entropy 作为置信度信号
  use_consensus_features: true
  use_disagreement_features: true
  use_confidence_features: true

  #  Patch 参数 (256256 图像) 
  patch_size: 64              # 每 patch 6464
  stride: 32                  # 50% 重叠  77 = 49 patches/image
  blend_mode: "gaussian"      # 合并模式: "gaussian" (推荐) / "average"

  #  温度退火 (softmax temperature) 
  temperature_start: 2.0      # 初期: 均匀探索, 让所有专家贡献
  temperature_end: 0.5        # 后期: 锐化选择, 突出最优专家

  #  负载平衡正则化 
  load_balance_weight: 0.01   # λ_lb, 防止一个专家主导所有 patch (Shazeer 2017)

  #  空间一致性正则化 (TV-norm on weight map) 
  spatial_smooth_weight: 0.001  # λ_tv; 0 = 关闭; 推荐 1e-3 ~ 1e-2

  #  前景过采样 
  foreground_oversample_ratio: 0.5   # 0 = 关闭; 推荐 0.3-0.7 for small lesions

training:
  batch_size: 512             # patch 级别 batch (512 patches  72MB 输入)
  epochs: 50
  lr: 1.0e-3

  optimizer:
    name: "adamw"
    weight_decay: 0.01

  scheduler:
    name: "cosine"
    min_lr: 1.0e-6
    warmup_epochs: 5

  amp:
    enabled: true
    dtype: "bfloat16"         # 5090 Blackwell 原生支持

  loss:
    name: "ce_plus_dice"      # fused_logits vs GT 端到端监督
    dice_smooth: 1.0
    ce_weight: 1.0
    dice_weight: 1.0

  dataloader:
    num_workers: 4
    pin_memory: true

  checkpoint:
    save_best: true
    save_last: true
    monitor: "val_dice"

  logging:
    log_interval: 50
    val_interval: 1