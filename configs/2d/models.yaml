# 2D 三专家配置 (双 RTX 5090 优化版)
# 用法: --models configs/2d/models.yaml
#
# 三专家组合: nnUNet (CNN) + SwinUNETR (Transformer) + SegResNet (ResEncoder)
# 所有专家统一输出 logits [B, M, H, W]
#
# nnUNet 使用官方 nnUNet v2 训练流程 (1000 epochs, SGD, PolyLR, 深度监督)
# 权重由 import_nnunet_weights.py 导入, Layer1 训练时 --skip-if-done 自动跳过
#
# 显存估算 (BF16, bs=16/卡):
#   nnUNet:     ~12GB/卡  (~46M params, 8-stage, 512×512, deep_supervision)
#   SwinUNETR:  ~14GB/卡  (~62M params, 256×256)
#   SegResNet:  ~5GB/卡   (~8M params, 256×256)



experts_v2:
- name: nnunet-2d
  type: nnunet
  params:
    conv_op: Conv2d
    n_stages: 7
    features_per_stage:
    - 32
    - 64
    - 128
    - 256
    - 512
    - 512
    - 512
    patch_size:
    - 256
    - 256
    deep_supervision: true
    n_conv_per_stage_encoder:
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    n_conv_per_stage_decoder:
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2
    conv_kernel_sizes:
    - - 3
      - 3
    - - 3
      - 3
    - - 3
      - 3
    - - 3
      - 3
    - - 3
      - 3
    - - 3
      - 3
    - - 3
      - 3
    pool_op_kernel_sizes:
    - - 1
      - 1
    - - 2
      - 2
    - - 2
      - 2
    - - 2
      - 2
    - - 2
      - 2
    - - 2
      - 2
    - - 2
      - 2
- name: swinunetr-2d
  type: monai_swin_unetr
  params:
    spatial_dims: 2
    feature_size: 48
    patch_size: 2
    depths:
    - 2
    - 2
    - 2
    - 2
    num_heads:
    - 3
    - 6
    - 12
    - 24
    use_checkpoint: true
- name: segresnet-2d
  type: monai_segresnet_ds
  params:
    spatial_dims: 2
    init_filters: 32
    blocks_down:
    - 1
    - 2
    - 2
    - 4
    - 4
    norm: BATCH
    act: relu
    dsdepth: 1
    upsample_mode: deconv
